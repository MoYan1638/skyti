<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkyTi · 数据看板</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root { --bg:#060c1a; --card:#0d1f42; --gold:#FFD966; --blue:#7EC8E3; --dim:#8BA4CC; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:linear-gradient(180deg,#060c1a 0%,#0d1f42 55%,#060c1a 100%); min-height:100vh;
         color:#fff; font-family:system-ui,sans-serif; padding:24px 16px 60px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { color:var(--gold); font-size:1.5em; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; color:var(--dim); font-size:.85em; margin-bottom:24px; }
  .card { background:rgba(13,31,66,.55); border:1px solid rgba(126,200,227,.18);
          border-radius:14px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:.8em; color:var(--dim); margin:10px 0 4px; }
  input { width:100%; padding:9px 12px; border-radius:8px; border:1px solid rgba(126,200,227,.3);
          background:rgba(6,12,26,.7); color:#fff; font-size:.9em; }
  .btn { display:inline-block; padding:9px 22px; margin-top:14px; border:none; border-radius:22px;
         background:linear-gradient(135deg,#FFD966,#f5b942); color:#1a1405; font-weight:bold;
         cursor:pointer; font-size:.9em; }
  .btn.ghost { background:transparent; color:var(--blue); border:1px solid var(--blue); }
  .hint { color:var(--dim); font-size:.78em; line-height:1.6; margin-top:10px; }
  .hint code { background:rgba(6,12,26,.8); padding:1px 6px; border-radius:4px; color:var(--gold); }
  .stats-row { display:flex; gap:12px; justify-content:space-around; text-align:center; flex-wrap:wrap; }
  .stats-num { font-size:1.8em; color:var(--gold); font-weight:bold; }
  .stats-label { font-size:.75em; color:var(--dim); }
  .warn { background:rgba(255,217,102,.08); border:1px solid rgba(255,217,102,.3);
          border-radius:10px; padding:10px 14px; font-size:.82em; color:var(--gold); margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:6px 16px; border-radius:16px; font-size:.8em; cursor:pointer;
         border:1px solid rgba(126,200,227,.35); color:var(--blue); background:transparent; }
  .tab.on { background:var(--blue); color:#06263a; font-weight:bold; }
  .row { margin-bottom:12px; }
  .row-head { display:flex; justify-content:space-between; font-size:.85em; margin-bottom:4px; }
  .row-name { color:#fff; } .row-name small { color:var(--dim); margin-left:6px; }
  .row-val { color:var(--blue); } .row-val b { color:var(--gold); }
  .bar-wrap { height:10px; border-radius:5px; background:rgba(6,12,26,.8); overflow:hidden; position:relative; }
  .bar-real { height:100%; background:linear-gradient(90deg,#7EC8E3,#FFD966); border-radius:5px; }
  .bar-sim { position:absolute; top:-2px; width:2px; height:14px; background:#fff; opacity:.65; }
  .legend { font-size:.72em; color:var(--dim); margin-top:6px; }
  #trend { display:flex; align-items:flex-end; gap:3px; height:96px; }
  #trend .t-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  #trend .t-bar { width:100%; min-height:2px; background:linear-gradient(180deg,#FFD966,#7EC8E3); border-radius:2px 2px 0 0; }
  #trend .t-n { font-size:.6em; color:#8BA4CC; margin-bottom:2px; }
  #trend .t-l { font-size:.56em; color:#5a6f95; margin-top:3px; white-space:nowrap; }
  .legend i { display:inline-block; width:14px; height:8px; border-radius:2px;
              background:linear-gradient(90deg,#7EC8E3,#FFD966); vertical-align:middle; margin-right:4px; }
  .legend u { text-decoration:none; display:inline-block; width:2px; height:10px; background:#fff;
              vertical-align:middle; margin:0 4px 0 12px; opacity:.65; }
  .empty { text-align:center; color:var(--dim); padding:30px 0; font-size:.9em; }
  .rec { display:flex; align-items:center; gap:10px; padding:8px 0; font-size:.8em;
         border-bottom:1px dashed rgba(126,200,227,.15); }
  .rec:last-child { border-bottom:none; }
  .rec-time { flex:0 0 auto; color:var(--gold); font-variant-numeric:tabular-nums; font-size:.95em; }
  .rec-main { flex:1; min-width:0; color:#c9d6ee; line-height:1.45; }
  .rec-main b { color:#fff; font-weight:normal; }
  .rec-main em { font-style:normal; color:var(--dim); }
  .rec-main i { font-style:normal; color:#7EC8E3; }
  .rec-fb { display:block; color:#a8b8d8; font-size:.92em; margin-top:2px; }
  .rec-detail { margin-top:4px; }
  .rec-detail summary { cursor:pointer; color:#7EC8E3; font-size:.92em; user-select:none; }
  .rec-detail-list { margin-top:4px; padding:6px 10px; background:rgba(6,12,26,.5); border-radius:8px; }
  .det-row { display:flex; justify-content:space-between; gap:12px; padding:2px 0; font-size:.9em; }
  .det-q { color:#8BA4CC; }
  .det-a { color:var(--gold); text-align:right; white-space:nowrap; }
  .rec-del { flex:0 0 auto; background:transparent; border:1px solid rgba(255,120,120,.5);
             color:#ff9b9b; border-radius:14px; padding:3px 10px; font-size:.78em; cursor:pointer; }
  .rec-del:hover { background:rgba(255,120,120,.15); }
  .rec-del:disabled { opacity:.5; cursor:default; }
  .rec-more { text-align:center; color:var(--dim); font-size:.75em; padding-top:10px; }
  .grp { border:1px solid rgba(126,200,227,.16); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .grp-head { display:flex; align-items:center; flex-wrap:wrap; column-gap:8px; row-gap:2px;
              padding:8px 10px; cursor:pointer;
              background:rgba(6,12,26,.45); font-size:.78em; user-select:none; }
  .grp-head:hover { background:rgba(6,12,26,.7); }
  .grp-arrow { color:var(--blue); transition:transform .2s; }
  .grp.fold .grp-arrow { transform:rotate(-90deg); }
  .grp-id { color:var(--gold); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .grp-n { color:#8BA4CC; white-space:nowrap; }
  .grp-latest { margin-left:auto; color:#5a6f95; font-size:.92em; white-space:nowrap; }
  .grp-del { margin-left:8px; }
  .grp-code { color:#5a6f95; font-size:.88em; margin-left:5px; }
  .grp-type { color:var(--blue); font-size:.94em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:9em; }
  @media (max-width:520px) {
    .grp-type { display:none; }
    .grp-latest { margin-left:0; }
  }
  .rec-hint { color:#5a6f95; font-size:.72em; margin:-2px 0 10px; line-height:1.5; }
  .grp-body { padding:2px 10px 4px; }
  .grp.fold .grp-body { display:none; }
  .card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .foot { text-align:center; color:#5a6f95; font-size:.72em; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✦ SkyTi 数据看板</h1>
  <p class="sub">真实稀有度统计 · 仅站长可见 · 数据为匿名结果（自建接口）</p>

  <div id="setup" class="card" style="display:none">
    <label>API 地址（默认已填好，不用改）</label>
    <input id="in-base" value="https://api.moyan06.icu" />
    <label>查看密钥（SKYTI_KEY，部署时设置的那个）</label>
    <input id="in-key" placeholder="skyti-admin-..." />
    <button class="btn" id="btn-save">保存并加载</button>
    <p class="hint">配置只存在你当前浏览器的 localStorage 里，不会上传。</p>
  </div>

  <div id="board" style="display:none">
    <div id="warn" class="warn" style="display:none"></div>
    <div class="card stats-row">
      <div><div class="stats-num" id="num-total">–</div><div class="stats-label">累计样本</div></div>
      <div><div class="stats-num" id="num-types">–</div><div class="stats-label">覆盖人格数 / 28</div></div>
      <div><div class="stats-num" id="num-users">–</div><div class="stats-label">独立旅人</div></div>
      <div><div class="stats-num" id="num-today">–</div><div class="stats-label">今日新增</div></div>
    </div>
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <div id="list"></div>
      <div class="legend"><i></i>实测占比 <u></u>白线 = 模拟稀有度参考</div>
    </div>
    <div class="card" id="rec-card" style="display:none">
      <div class="card-head">
        <div style="color:#FFD966;font-size:.85em;font-weight:bold">📋 记录明细</div>
        <div id="rec-count" style="color:#8BA4CC;font-size:.72em"></div>
      </div>
      <div id="rec-list"></div>
      <div class="rec-hint">同一个人 = 同一浏览器；#号按首次答题先后编，与下面的排行无关。点组头可折叠。</div>
      <div class="rec-more" id="rec-more" style="display:none"></div>
    </div>
    <div class="card" id="trend-card" style="display:none">
      <div style="color:#FFD966;font-size:.85em;font-weight:bold;margin-bottom:10px">📈 近 14 天答题趋势</div>
      <div id="trend"></div>
    </div>
    <div class="card" id="fb-card" style="display:none">
      <div style="color:#FFD966;font-size:.85em;font-weight:bold;margin-bottom:10px">💬 最新意见反馈</div>
      <div id="fb-list"></div>
    </div>
    <div style="text-align:center">
      <button class="btn ghost" id="btn-refresh">↻ 刷新数据</button>
      <button class="btn ghost" id="btn-export">⬇ 导出 CSV</button>
      <button class="btn ghost" id="btn-logout">清除本机配置</button>
    </div>
  </div>

  <p class="foot">SkyTi 数据看板 · sky墨言·出品</p>
</div>

<script>
const CFG_KEY = 'skyti_stats_cfg_v1'
const VERSIONS = { all: '全部', standard: '标准版 30题', demo: 'Demo 15题', pro: 'Pro 52题' }
let cfg = null, allRows = [], simMap = {}, curVer = 'all', qMap = {}

const $ = id => document.getElementById(id)
const REC_LIMIT = 200

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}
/** 统一时间格式：2026-09-28 16:42:03 */
function fmtTime(ts) {
  if (!ts) return '—'
  const d = new Date(Number(ts))
  const p = n => String(n).padStart(2, '0')
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
}

function loadCfg() {
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null') } catch (e) { return null }
}

async function fetchAll() {
  const url = `${cfg.apiBase}/?action=stats&key=${encodeURIComponent(cfg.key)}`
  const r = await fetch(url)
  if (!r.ok) throw new Error('HTTP ' + r.status)
  const data = await r.json()
  if (!data.ok) throw new Error(data.error || '未知错误')
  return data.records || []
}

function aggregate(rows) {
  const m = {}
  rows.forEach(r => { const k = r.code || '未知'; m[k] = m[k] || { cn: r.cn || '', n: 0 }; m[k].n++ })
  return Object.entries(m).sort((a, b) => b[1].n - a[1].n)
}

function renderFeedback(rows) {
  const fbs = rows.filter(r => r.feedback && r.feedback !== '无反馈').slice(0, 10)
  const card = $('fb-card')
  if (!fbs.length) { card.style.display = 'none'; return }
  card.style.display = 'block'
  const list = $('fb-list')
  list.innerHTML = ''
  fbs.forEach(r => {
    const div = document.createElement('div')
    div.style.cssText = 'font-size:.8em;color:#c9d6ee;margin-bottom:8px;line-height:1.5'
    div.textContent = `【${r.code} · ${VERSIONS[r.v] || r.v || '?'} · ${fmtTime(r.ts)} · ${r.uid ? '旅人 ' + String(r.uid).slice(-6) : '未标记'}】${r.feedback}`
    list.appendChild(div)
  })
}

/** 记录明细：同一人的多次答题归为一组，组内按时间倒序，可单条/整组删除 */
let folded = {}
const GROUP_LIMIT = 60
const REC_PER_GROUP = 20

function uidKey(r) { return r.uid ? String(r.uid) : '__legacy__' }

/** 按匿名 uid 分组，组间按最近答题时间倒序 */
function groupRows(rows) {
  const m = new Map()
  rows.forEach(r => {
    const k = uidKey(r)
    if (!m.has(k)) m.set(k, [])
    m.get(k).push(r)
  })
  return [...m.entries()].map(([k, items]) => {
    items.sort((a, b) => (Number(b.ts) || 0) - (Number(a.ts) || 0))
    const tsAll = items.map(x => Number(x.ts) || 0).filter(n => n > 0)
    return {
      key: k, items,
      latest: tsAll.length ? Math.max(...tsAll) : 0,
      first: tsAll.length ? Math.min(...tsAll) : Infinity
    }
  }).sort((a, b) => b.latest - a.latest)
}

/** 给每位旅人编个稳定号：#1 #2 …（按首次答题先后，与列表排序无关） */
function userNumbers(groups) {
  const num = new Map()
  let n = 0
  groups.slice().sort((a, b) => a.first - b.first).forEach(g => {
    if (g.key !== '__legacy__') num.set(g.key, ++n)
  })
  return num
}

function recordEl(r) {
  const div = document.createElement('div')
  div.className = 'rec'
  const fb = r.feedback && r.feedback !== '无反馈'
    ? `<span class="rec-fb">💬 ${esc(r.feedback)}</span>` : ''
  div.innerHTML = `<span class="rec-time">${fmtTime(r.ts)}</span>
    <span class="rec-main"><b>${esc(r.cn || '未知')}</b> <em>${esc(r.code || '')}</em> · <i>${esc(VERSIONS[r.v] || r.v || '?')}</i>${fb}</span>`
  // 答题明细（题目ID → 选项），点击展开逐题对照题库展示
  if (r.detail && typeof r.detail === 'object') {
    const entries = Object.entries(r.detail)
    if (entries.length) {
      const det = document.createElement('details')
      det.className = 'rec-detail'
      const sum = document.createElement('summary')
      sum.textContent = `📋 答题明细（${entries.length} 题）`
      det.appendChild(sum)
      const listEl = document.createElement('div')
      listEl.className = 'rec-detail-list'
      listEl.innerHTML = entries.map(([qid, val]) => {
        const q = qMap[qid]
        const opt = q && q.options ? q.options[Number(val)] : null
        return `<div class="det-row"><span class="det-q">${esc(q ? q.text : qid)}</span><span class="det-a">${esc(opt ? opt.label : '选项' + (Number(val) + 1))}</span></div>`
      }).join('')
      det.appendChild(listEl)
      div.querySelector('.rec-main').appendChild(det)
    }
  }
  const btn = document.createElement('button')
  btn.className = 'rec-del'
  btn.textContent = '删除'
  btn.onclick = () => delRecord(r.ts, btn)
  div.appendChild(btn)
  return div
}

function groupEl(g, items, num) {
  const legacy = g.key === '__legacy__'
  const box = document.createElement('div')
  box.className = 'grp' + (folded[g.key] ? ' fold' : '')

  const head = document.createElement('div')
  head.className = 'grp-head'
  const label = legacy
    ? '❔ 未标记（改动前的旧数据）'
    : `👤 旅人 #${num || '?'}<span class="grp-code">${esc(g.key.slice(-6))}</span>`
  const latestType = g.items[0] && g.items[0].cn
    ? `<span class="grp-type">最近测出 ${esc(g.items[0].cn)}</span>` : ''
  head.innerHTML = `<span class="grp-arrow">▾</span>
    <span class="grp-id">${label}</span>
    <span class="grp-n">· ${g.items.length} 次</span>
    ${latestType}
    <span class="grp-latest">最近 ${fmtTime(g.latest)}</span>`
  head.onclick = () => {
    folded[g.key] = !folded[g.key]
    box.classList.toggle('fold', !!folded[g.key])
  }
  if (!legacy) {
    const del = document.createElement('button')
    del.className = 'rec-del grp-del'
    del.textContent = '删除整组'
    del.onclick = e => { e.stopPropagation(); delGroup(g.key, g.items, del) }
    head.appendChild(del)
  }

  const body = document.createElement('div')
  body.className = 'grp-body'
  items.forEach(r => body.appendChild(recordEl(r)))
  if (items.length < g.items.length) {
    const m = document.createElement('div')
    m.className = 'rec-more'
    m.textContent = `本组还有 ${g.items.length - items.length} 条更早的记录（用「导出 CSV」看全部）`
    body.appendChild(m)
  }
  box.appendChild(head)
  box.appendChild(body)
  return box
}

function renderRecords(rows) {
  const card = $('rec-card'), list = $('rec-list'), more = $('rec-more')
  const groups = groupRows(rows)
  card.style.display = 'block'
  $('rec-count').textContent = `${rows.length} 条 · ${groups.length} 位旅人` +
    (curVer === 'all' ? '' : ` · ${VERSIONS[curVer]}`)
  list.innerHTML = ''
  if (!rows.length) {
    list.innerHTML = '<div class="empty">暂无记录 ✨</div>'
    more.style.display = 'none'
    return
  }
  let shown = 0, gShown = 0
  const nums = userNumbers(groups)
  for (const g of groups) {
    if (shown >= REC_LIMIT || gShown >= GROUP_LIMIT) break
    const take = g.items.slice(0, Math.min(REC_PER_GROUP, REC_LIMIT - shown))
    shown += take.length
    gShown++
    list.appendChild(groupEl(g, take, nums.get(g.key)))
  }
  const rest = rows.length - shown
  if (rest > 0 || groups.length > gShown) {
    more.style.display = 'block'
    more.textContent = `已显示 ${gShown} 位旅人 / 共 ${groups.length} 位、${shown} 条 / 共 ${rows.length} 条（全部数据可用「导出 CSV」查看）`
  } else {
    more.style.display = 'none'
  }
}

async function postDelete(body, btn, busyText) {
  const old = btn.textContent
  btn.disabled = true
  btn.textContent = busyText
  const r = await fetch(`${cfg.apiBase}/`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ action: 'delete', key: cfg.key }, body))
  })
  const data = await r.json()
  if (!data.ok) { btn.disabled = false; btn.textContent = old; throw new Error(data.error || '删除失败') }
  return data
}

async function delRecord(ts, btn) {
  if (!ts) { alert('这条记录没有时间戳，无法删除'); return }
  if (!confirm(`确定删除这条记录吗？\n${fmtTime(ts)}\n删除后不可恢复。`)) return
  try {
    await postDelete({ ts: Number(ts) }, btn, '删除中…')
    allRows = allRows.filter(x => Number(x.ts) !== Number(ts))
    render()
  } catch (e) { alert('删除失败：' + e.message) }
}

async function delGroup(key, items, btn) {
  const tsList = items.map(r => Number(r.ts)).filter(n => n > 0)
  if (!tsList.length) { alert('这组记录没有时间戳，无法删除'); return }
  if (!confirm(`确定删除「旅人 ${key.slice(-6)}」的全部 ${tsList.length} 条记录吗？\n删除后不可恢复。`)) return
  try {
    const data = await postDelete({ tsList }, btn, '删除中…')
    const set = new Set(tsList)
    allRows = allRows.filter(x => !set.has(Number(x.ts)))
    render()
    if (data.removed !== tsList.length) alert(`服务端实际删除 ${data.removed} 条（可能有记录已被删过）。`)
  } catch (e) { alert('删除失败：' + e.message) }
}

function renderTrend(rows) {
  const days = []
  const start = new Date(); start.setHours(0, 0, 0, 0)
  for (let i = 13; i >= 0; i--) {
    const d = new Date(start.getTime() - i * 86400000)
    days.push({ t: d.getTime(), label: `${d.getMonth() + 1}/${d.getDate()}`, n: 0 })
  }
  rows.forEach(r => {
    if (!r.ts) return
    const d = new Date(r.ts); d.setHours(0, 0, 0, 0)
    const hit = days.find(x => x.t === d.getTime())
    if (hit) hit.n++
  })
  const max = Math.max(...days.map(d => d.n), 1)
  const el = $('trend')
  el.innerHTML = ''
  days.forEach(d => {
    const col = document.createElement('div')
    col.className = 't-col'
    col.innerHTML = `<span class="t-n">${d.n || ''}</span>
      <div class="t-bar" style="height:${(d.n / max * 70).toFixed(0)}px" title="${d.label}：${d.n} 人"></div>
      <span class="t-l">${d.label}</span>`
    el.appendChild(col)
  })
  $('trend-card').style.display = 'block'
}

function render() {
  const rows = curVer === 'all' ? allRows : allRows.filter(r => r.v === curVer)
  const total = rows.length
  $('num-total').textContent = total
  const agg = aggregate(rows)
  $('num-types').textContent = agg.length
  $('num-users').textContent = new Set(rows.filter(r => r.uid).map(r => String(r.uid))).size
  const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0)
  $('num-today').textContent = allRows.filter(r => (r.ts || 0) >= todayStart.getTime()).length

  const warn = $('warn')
  if (total < (cfg.minSample || 500)) {
    warn.style.display = 'block'
    warn.textContent = `⏳ 样本累积中：${total} / ${cfg.minSample || 500}。样本不足期间，结果页继续展示模拟稀有度，攒够后可切换为真实数据。`
  } else { warn.style.display = 'none' }

  const maxN = agg.length ? agg[0][1].n : 1
  const list = $('list')
  renderRecords(rows)
  renderFeedback(rows)
  renderTrend(rows)
  list.innerHTML = agg.length ? '' : '<div class="empty">暂无数据，去做个测试试试吧 ✨</div>'
  agg.forEach(([code, v], i) => {
    const pct = (v.n / total * 100)
    const sim = simMap[code]
    // 参考线位置：把模拟占比换算成等比人数，再除以最大人数得到条内位置
    let simMark = ''
    if (sim) {
      const simN = parseFloat(sim) / 100 * total
      simMark = `<div class="bar-sim" style="left:${Math.min(100, simN / maxN * 100).toFixed(1)}%"></div>`
    }
    const div = document.createElement('div')
    div.className = 'row'
    div.innerHTML = `
      <div class="row-head">
        <span class="row-name">#${i + 1} ${code}<small>${v.cn}</small></span>
        <span class="row-val"><b>${pct.toFixed(1)}%</b> · ${v.n} 人${sim ? ` <small style="color:#8BA4CC">(模拟 ${sim})</small>` : ''}</span>
      </div>
      <div class="bar-wrap">
        <div class="bar-real" style="width:${(v.n / maxN * 100).toFixed(1)}%"></div>
        ${simMark}
      </div>`
    list.appendChild(div)
  })
}

function renderTabs() {
  const tabs = $('tabs')
  tabs.innerHTML = ''
  Object.entries(VERSIONS).forEach(([k, label]) => {
    const b = document.createElement('button')
    b.className = 'tab' + (k === curVer ? ' on' : '')
    b.textContent = label
    b.onclick = () => { curVer = k; renderTabs(); render() }
    tabs.appendChild(b)
  })
}

async function load() {
  try {
    $('btn-refresh').textContent = '加载中…'
    allRows = await fetchAll()
    $('btn-refresh').textContent = '↻ 刷新数据'
    render()
  } catch (e) {
    $('btn-refresh').textContent = '↻ 刷新数据'
    alert('加载失败：' + e.message + '\n请检查 API 地址与查看密钥是否正确。')
  }
}

function boot() {
  cfg = loadCfg()
  // 支持 ?key=xxx 直达（方便站长收藏带密钥的链接）
  const urlKey = new URLSearchParams(location.search).get('key')
  if (urlKey && (!cfg || cfg.key !== urlKey)) {
    cfg = Object.assign(cfg || { apiBase: 'https://api.moyan06.icu' }, { key: urlKey })
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg))
  }
  if (!cfg) {
    $('setup').style.display = 'block'
    return
  }
  $('board').style.display = 'block'
  $('in-base').value = cfg.apiBase || 'https://api.moyan06.icu'; $('in-key').value = cfg.key || ''
  // 模拟稀有度参考线（public/data/types.json）
  fetch('data/types.json').then(r => r.ok ? r.json() : null).then(t => {
    if (!t) return
    const map = {}
    const put = o => Object.values(o || {}).forEach(x => { if (x.code && x.rarity) map[x.code] = x.rarity })
    put(t.standard); put(t.special)
    simMap = map
    render()
  }).catch(() => {})
  // 题库（答题明细展示用：qid → 题目/选项文本）
  fetch('data/questions-pool.json').then(r => r.ok ? r.json() : null).then(p => {
    if (!p || !Array.isArray(p.main)) return
    qMap = {}
    p.main.forEach(q => { qMap[q.id] = q })
    render()
  }).catch(() => {})
  load()
}

$('btn-save').onclick = () => {
  const base = $('in-base').value.trim().replace(/\/+$/, '')
  const key = $('in-key').value.trim()
  if (!base || !key) { alert('请填写完整'); return }
  localStorage.setItem(CFG_KEY, JSON.stringify({ apiBase: base, key, minSample: 500 }))
  boot()
}
$('btn-refresh').onclick = load
$('btn-export').onclick = () => {
  if (!allRows.length) { alert('暂无数据可导出'); return }
  // UTF-8 BOM，保证 Excel 打开中文不乱码
  const head = 'code,cn,user,version,levels,feedback,time'
  const csvEsc = v => `,"${String(v == null ? '' : v).replace(/"/g, '""')}"`
  const body = allRows.map(r => [
    r.code, r.cn, r.uid || '未标记', r.v, r.levels, r.feedback || '无反馈',
    fmtTime(r.ts)
  ].map(csvEsc).join('')).join('\n')
  const blob = new Blob(['\ufeff' + head + '\n' + body], { type: 'text/csv;charset=utf-8' })
  const a = document.createElement('a')
  a.download = `SkyTi-数据导出-${new Date().toISOString().slice(0, 10)}.csv`
  a.href = URL.createObjectURL(blob)
  a.click()
  URL.revokeObjectURL(a.href)
}
$('btn-logout').onclick = () => { localStorage.removeItem(CFG_KEY); location.reload() }

boot()
</script>
</body>
</html>
